<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--ink:#1F2937;--muted:#64748B;--line:#E8EDF3;--field:#F8FAFC;--blue:#3463E0;--blue-soft:#EEF4FF;
  --use:#4F80EC;--use-b:#3D6FE0;--done:#F2CE4A;--done-b:#E2B93B;--done-ink:#6B3F12;
  --turn:#8B6CDF;--turn-b:#7757D4;--bad:#E5484D;--bad-b:#D23A3F;--ok:#2E7D46;--ok-bg:#E3F6E8;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.wrap{max-width:520px;margin:0 auto}
header{background:#fff;border-bottom:1px solid var(--line);padding:32px 24px 24px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{margin:0;font-size:32px;font-weight:900;color:var(--blue);letter-spacing:-.5px;line-height:1.1;min-width:0}
.sub{margin:6px 0 0;font-size:18px;font-weight:700}
.clock{text-align:right;font-size:15px;font-weight:600;color:var(--muted)}
.clock b{display:block;color:#5B8DEF;font-weight:700;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:24px 20px 40px}
.tile{font:inherit;color:inherit;border:2px solid #DCE6F5;background:#fff;border-radius:24px;padding:20px 10px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;min-height:200px;text-align:center}
.tile .ib{width:72px;height:72px;border-radius:18px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center}
.tile img{width:46px;height:56px;object-fit:contain}
.tname{font-size:17px;font-weight:800;color:var(--blue)}
.chip{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:4px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .chip{background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:5px 14px}
.tbig{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.tsmall{font-size:12px;font-weight:700;opacity:.85}
.tile.use{background:var(--use);border-color:var(--use-b);color:#fff}
.tile.done{background:var(--done);border-color:var(--done-b);color:var(--done-ink)}
.tile.turn{background:var(--turn);border-color:var(--turn-b);color:#fff}
.tile.bad{background:var(--bad);border-color:var(--bad-b);color:#fff}
.tile.use .tname,.tile.done .tname,.tile.turn .tname,.tile.bad .tname{color:inherit}
.tile.use .ib,.tile.turn .ib,.tile.bad .ib{background:rgba(255,255,255,.9)}
.tile.done .ib{background:rgba(255,255,255,.55)}
.tile.use .chip,.tile.turn .chip,.tile.bad .chip{background:rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:4px 10px}
.tile.done .chip{background:#F8DF6E;color:var(--done-ink)}
.tile.bad img{filter:grayscale(1)}
/* bottom sheet */
#shade{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#shade.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:12px 24px calc(28px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;z-index:11}
#sheet.show{transform:none}
@media (prefers-reduced-motion:reduce){#sheet,#shade{transition:none}}
.handle{display:block;width:44px;height:6px;border-radius:999px;background:#E2E8F0;margin:0 auto 18px;border:0;padding:0;cursor:pointer}
.shead{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.shead .ib{width:64px;height:64px;border-radius:18px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;flex:none}
.shead img{width:40px;height:50px;object-fit:contain}
.stitle{margin:0;font-size:26px;font-weight:800;letter-spacing:-.4px}
.slabel{margin:2px 0 0;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.box{border-radius:22px;padding:20px;text-align:center;margin-bottom:18px}
.box h3{margin:0;font-size:22px;font-weight:800}
.box p{margin:6px 0 0;font-size:15px}
.box.use{background:var(--use);color:#fff;box-shadow:0 10px 24px rgba(79,128,236,.25)}
.box.use small{display:block;font-size:13px;font-weight:700;letter-spacing:.12em;opacity:.8}
.timer{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.1}
.pill{display:inline-block;margin-top:8px;background:rgba(0,0,0,.14);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:700}
.box.done{background:#FFFBE8;border:1.5px solid #F7E58A;color:#8A5A12}
.box.turn{background:#F3EFFD;border:1.5px solid #D9CCF7;color:#5A3A9E}
.box.bad{background:#FDECEC;border:1.5px solid #F5B5B5;color:#B42318}
label{display:block;font-size:15px;font-weight:700;margin:0 0 8px}
.field{margin-bottom:16px}
input{font:inherit;font-size:17px;font-weight:600;width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--field);color:var(--ink)}
input::placeholder{color:#A0AEC0}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0}
button{font:inherit;cursor:pointer}
.primary{width:100%;min-height:56px;border:0;border-radius:18px;background:var(--blue);color:#fff;font-size:18px;font-weight:800;box-shadow:0 8px 20px rgba(52,99,224,.25)}
.secondary{width:100%;min-height:48px;border:0;border-radius:16px;background:#EEF2F7;color:var(--ink);font-size:16px;font-weight:700;margin-top:10px}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin-top:18px}
.link{border:0;background:none;padding:8px 0;color:var(--muted);font-size:14px;font-weight:600;text-decoration:underline}
.undo{display:block;margin:0 auto 12px;border:0;background:#EEF4FF;color:var(--blue);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700}
.wl{background:var(--field);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin-top:4px}
.wlhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wlhead b{font-size:17px}
.badge{background:#E2E8F0;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;color:#475569}
.join{display:flex;gap:10px}
.join input{background:#fff}
.join button{border:0;border-radius:14px;background:var(--ink);color:#fff;font-size:17px;font-weight:800;padding:0 22px;min-height:50px}
.wl ol{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.wl li{background:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.wl li .n{color:#94A3B8;font-weight:700}
.wl li .who{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl li .me{color:#5B8DEF;font-weight:700}
.wl li .x{border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;text-decoration:underline;padding:4px}
.hist{list-style:none;margin:8px 0 0;padding:0;font-size:13px;color:var(--muted)}
.hist li{padding:3px 0}
button:focus-visible,input:focus-visible,.tile:focus-visible{outline:3px solid #9DB9F5;outline-offset:2px}
button:disabled{opacity:.6}
#toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;background:#B42318;color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;display:none;z-index:40}
#toast.show{display:block}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:30}
#modal.show{display:flex}
#modal .card{background:#fff;border-radius:24px;padding:22px;max-width:340px;width:100%}
#modal p{margin:0 0 18px;font-size:17px;font-weight:700}
#modal .row{display:flex;gap:10px}
#modal .row button{flex:1;min-height:50px;border:0;border-radius:14px;font-size:16px;font-weight:800}
#modalNo{background:#EEF2F7;color:var(--ink)}
#modalYes{background:var(--blue);color:#fff}
.top{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lang{display:inline-flex;background:#EEF2F7;border-radius:999px;padding:3px}
.lang button{border:0;background:none;border-radius:999px;padding:6px 12px;min-height:32px;font-size:13px;font-weight:800;color:var(--muted)}
.lang button[aria-pressed="true"]{background:#fff;color:var(--blue);box-shadow:0 1px 2px rgba(15,23,42,.08)}
</style>
</head>
<body data-focus="<?= focus ?>">
<div class="wrap">
  <header>
    <h1 class="brand" id="subtitle">Laundry Tracker</h1>
    <div class="top">
      <div class="lang" role="group" aria-label="Language"><button type="button" id="lang-en">EN</button><button type="button" id="lang-fr">FR</button></div>
      <div class="clock" aria-live="off"><span id="date"></span><b id="time"></b></div>
    </div>
  </header>
  <main class="grid" id="grid"></main>
</div>
<div id="shade"></div>
<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle"></section>
<div id="toast" role="alert"></div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalText">
  <div class="card"><p id="modalText"></p>
    <div class="row"><button id="modalNo" type="button">No</button><button id="modalYes" type="button">Yes</button></div>
  </div>
</div>

const storageOk = (() => { try { localStorage.setItem('__t', '1'); const ok = localStorage.getItem('__t') === '1'; localStorage.removeItem('__t'); return ok; } catch (e) { return false; } })();
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let lang = store.get('lang', (navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'en');
let T = TEXT[lang];
function setLang(l) {
  lang = l; T = TEXT[l]; store.set('lang', l);
  document.documentElement.lang = l;
  $('lang-en').setAttribute('aria-pressed', l === 'en'); $('lang-fr').setAttribute('aria-pressed', l === 'fr');
  $('subtitle').textContent = T.subtitle; $('modalNo').textContent = T.no; $('modalYes').textContent = T.yes;
  tickClock(); if (data) render();
}

let data = null, offset = 0, working = false, pending = false, opened = false;

let sheetId = null, mode = null, showHist = false;
const draft = { minutes: '', note: '' };

let myName = store.get('nick', '');
let myQueue = store.get('myQueue2', []);   // [{id, key}] waitlist entries this phone joined
const setName = v => { myName = v.trim().slice(0, 20); store.set('nick', myName); };

function call(fn, ...args) {
  return new Promise((res, rej) => { const r = google.script.run.withSuccessHandler(res).withFailureHandler(rej); r[fn](...args); });
}
const now = () => Date.now() + offset;
const pad = n => String(n).padStart(2, '0');
const timeStr = (d, sec) => d.toLocaleTimeString(T.locale, sec ? { hour: 'numeric', minute: '2-digit', second: '2-digit' } : { hour: 'numeric', minute: '2-digit' });
const dateStr = d => d.toLocaleDateString(T.locale, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
function fmt(t) {   // time only for today, otherwise date + time
  const d = new Date(t), n = new Date(now());
  return (d.toDateString() === n.toDateString() ? '' : d.toLocaleDateString(T.locale, { day: 'numeric', month: 'short' }) + ', ') + timeStr(d);
}
const mins = t => Math.max(0, Math.ceil((t - now()) / 60000));
function mmss(t) { const s = Math.max(0, Math.round((t - now()) / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + pad(m) : m) + ':' + pad(s % 60); }
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.toggle('show', !!t); clearTimeout(toastTimer); if (t) toastTimer = setTimeout(() => e.classList.remove('show'), 6000); }
function errText(e) {   // server errors arrive as E:code:detail
  const msg = String(e && e.message || e || '');
  const mt = /E:(\w+)(?::(.*))?$/.exec(msg);
  if (!mt) return T.err.other;
  const f = T.err[mt[1]];
  if (typeof f === 'function') return mt[1] === 'minutes' ? f(max()) : f(mt[2] || '');
  return f || T.err.other;
}
function ask(text) {
  return new Promise(res => {
    $('modalText').textContent = text; $('modal').classList.add('show'); $('modalYes').focus();
    const done = v => { $('modal').classList.remove('show'); $('modalYes').onclick = $('modalNo').onclick = null; res(v); };
    $('modalYes').onclick = () => done(true); $('modalNo').onclick = () => done(false);
  });
}
const max = () => (data && data.maxMinutes) || 75;
const same = (a, b) => !!a && !!b && a.trim().toLowerCase() === b.trim().toLowerCase();
const mach = id => data.machines.find(m => m.id === id);
const mname = m => T[m.type] + ' ' + m.id;
const cur = id => data.state[id] || { status: 'free' };
const queue = id => (data.queue && data.queue[id]) || [];
const holdOf = id => { const h = data.hold && data.hold[id]; return h && h.qid && h.until > now() ? h : null; };
const myKey = entryId => { const e = myQueue.find(x => x.id === entryId); return e ? e.key : null; };
const mineEntry = e => !!myKey(e.id);                          // joined from this phone
const mineHold = h => !!h && (!!myKey(h.qid) || same(h.name, myName));
const whoName = w => (!w || w === 'Unknown' || w === 'Not logged') ? T.unknown : w;
function state(id) {   // free | turn | use | done | bad
  const c = cur(id);
  if (c.status === 'broken') return 'bad';
  if (c.status === 'use') return now() < c.end ? 'use' : 'done';
  return holdOf(id) ? 'turn' : 'free';
}
function logLine(x) {
  if (x.text) return fmt(x.t) + ' · ' + x.text;                  // older entries were saved as plain text
  const f = T.log[x.k]; const what = typeof f === 'function' ? f(x.x) : (f || x.k);
  return fmt(x.t) + ' · ' + (x.who || T.someone.replace(/^./, c => c.toUpperCase())) + ' ' + what;
}

const uiBusy = () => working || $('modal').classList.contains('show') || Date.now() - lastPointer < 800 ||
  (document.activeElement && document.activeElement.tagName === 'INPUT');
function wake() { lastActive = Date.now(); if (paused) { paused = false; load(); } }
document.addEventListener('pointerdown', () => { lastPointer = Date.now(); wake(); }, true);
document.addEventListener('keydown', e => { wake(); if (e.key === 'Escape' && sheetId && !$('modal').classList.contains('show')) closeSheet(); }, true);

function apply(d, force) {
  data = d; offset = d.now - Date.now();
  const ids = Object.values(d.queue || {}).flat().map(e => e.id);
  myQueue = myQueue.filter(x => ids.includes(x.id)); store.set('myQueue2', myQueue);
  if (force || !uiBusy()) render(); else pending = true;
  if (FOCUS && !opened && mach(FOCUS)) { opened = true; openSheet(FOCUS); }
}
function load() { call('getStatus').then(d => apply(d)).catch(() => toast(T.err.connect)); }

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function btn(text, cls, fn) { const b = el('button', cls, text); b.type = 'button'; b.onclick = fn; return b; }
function iconBox(m) { const b = el('div', 'ib'); const i = el('img'); i.src = ICONS[m.type]; i.alt = ''; b.appendChild(i); return b; }

// ---------- grid ----------
function render() {
  pending = false;
  const g = $('grid'); g.innerHTML = '';
  data.machines.forEach(m => g.appendChild(tile(m)));
  if (sheetId) renderSheet();
}

function tile(m) {
  const c = cur(m.id), s = state(m.id), h = holdOf(m.id), q = queue(m.id);
  const t = el('button', 'tile ' + s); t.type = 'button'; t.dataset.id = m.id; t.dataset.s = s;
  t.onclick = () => openSheet(m.id);
  t.appendChild(iconBox(m));
  t.appendChild(el('span', 'tname', mname(m)));
  if (s === 'free') t.appendChild(el('span', 'chip', T.available));
  if (s === 'use') { t.appendChild(el('span', 'chip', whoName(c.who))); const b = el('span', 'tbig', T.minShort(mins(c.end))); b.dataset.end = c.end; t.appendChild(b); }
  if (s === 'done') t.appendChild(el('span', 'chip', T.finished));
  if (s === 'turn') { t.appendChild(el('span', 'chip', mineHold(h) ? T.yourTurnChip : T.turnOf(h.name))); const b = el('span', 'tbig', T.minShort(mins(h.until))); b.dataset.end = h.until; t.appendChild(b); }
  if (s === 'bad') t.appendChild(el('span', 'chip', T.broken));
  const waiting = q.length - (h ? 1 : 0);
  if (waiting > 0 && s !== 'free') t.appendChild(el('span', 'tsmall', T.waitingN(waiting)));
  return t;
}

// ---------- sheet ----------
function openSheet(id) { sheetId = id; mode = null; showHist = false; draft.minutes = ''; draft.note = ''; renderSheet(); $('shade').classList.add('show'); $('sheet').classList.add('show'); }
function closeSheet() { sheetId = null; $('shade').classList.remove('show'); $('sheet').classList.remove('show'); }
$('shade').onclick = closeSheet;

function nameField() {
  const f = el('div', 'field'); const l = el('label', null, T.yourName); const i = el('input');
  i.value = myName; i.placeholder = T.namePh; i.maxLength = 20; i.id = 'nameIn';
  i.addEventListener('input', () => setName(i.value)); l.htmlFor = 'nameIn';
  f.appendChild(l); f.appendChild(i); return f;
}
function minutesField(edit) {
  const f = el('div', 'field'); const l = el('label', null, edit ? T.minutesNow : T.minutesLeft); const i = el('input');
  i.type = 'number'; i.inputMode = 'numeric'; i.min = edit ? 0 : 1; i.max = max(); i.step = 1; i.id = 'minIn'; i.placeholder = T.minutesPh;
  i.value = draft.minutes; i.addEventListener('input', () => { draft.minutes = i.value; }); l.htmlFor = 'minIn';
  f.appendChild(l); f.appendChild(i); f.appendChild(el('p', 'hint', edit ? T.rangeEdit(max()) : T.range(max()))); return f;
}
function minutesValue(lo) {   // whole number between lo and the maximum, otherwise a message
  const v = String(draft.minutes).trim();
  if (/^\d+$/.test(v) && +v >= lo && +v <= max()) return +v;
  toast(lo === 0 ? T.err.minutesEdit(max()) : T.err.minutes(max()));
  return null;
}

function renderSheet() {
  const m = mach(sheetId), c = cur(m.id), s = state(m.id), h = holdOf(m.id);
  const sh = $('sheet'); const keepScroll = sh.scrollTop; sh.innerHTML = '';
  const handle = btn('', 'handle', closeSheet); handle.setAttribute('aria-label', T.close); sh.appendChild(handle);
  const head = el('div', 'shead'); head.appendChild(iconBox(m));
  const tt = el('div'); const h2 = el('h2', 'stitle', mname(m)); h2.id = 'stitle'; tt.appendChild(h2);
  tt.appendChild(el('p', 'slabel', { free: T.available, turn: T.saved, use: T.inUse, done: T.finished, bad: T.broken }[s]));
  head.appendChild(tt); sh.appendChild(head);

  if (c.prev && c.at && now() - c.at < data.undoMinutes * 60000 && !mode)
    sh.appendChild(btn(T.undo, 'undo', () => act('undo', m.id, myName)));

  if (mode && modeState !== s) mode = null;   // someone changed this machine meanwhile
  if (mode) { sh.appendChild(modeForm(m, c)); sh.scrollTop = keepScroll; return; }

  const links = [];
  if (s === 'free' || (s === 'turn' && mineHold(h))) {
    if (s === 'turn') { const b = el('div', 'box turn'); b.appendChild(el('h3', null, T.yourTurn)); b.appendChild(el('p', null, T.startWithin(mins(h.until)))); sh.appendChild(b); }
    sh.appendChild(nameField()); sh.appendChild(minutesField(false));
    sh.appendChild(btn(T.start, 'primary', () => {
      const n = minutesValue(1); if (n === null) return;
      if (!myName && s === 'turn') setName(h.name);
      act('start', m.id, n, myName, 'start');
    }));
    if (s === 'turn') { const gap = el('div'); gap.style.height = '16px'; sh.appendChild(gap); sh.appendChild(waitlist(m)); }
    if (s === 'turn') {
      const entry = queue(m.id).find(e => e.id === h.qid);
      if (myKey(h.qid) || (entry && entry.old))
        links.push([T.skipTurn, async () => { if (await ask(T.askSkip)) run('leaveQueue', [m.id, h.qid, myKey(h.qid) || '']); }]);
    }
    if (s === 'free' && queue(m.id).length) { const gap = el('div'); gap.style.height = '16px'; sh.appendChild(gap); sh.appendChild(waitlist(m)); }
    links.push([T.markInUseLink, () => setMode('proxy')], [T.outOfOrder, () => setMode('broken')]);
  } else if (s === 'turn') {
    const b = el('div', 'box turn'); b.appendChild(el('h3', null, T.waitingFor(h.name))); b.appendChild(el('p', null, T.minLeft(mins(h.until)))); sh.appendChild(b);
    sh.appendChild(waitlist(m));
    links.push([T.markInUseLink, () => setMode('proxy')]);
  } else if (s === 'use') {
    const b = el('div', 'box use'); b.appendChild(el('small', null, T.timeRemaining));
    const tm = el('div', 'timer', mmss(c.end)); tm.dataset.mmss = c.end; b.appendChild(tm);
    b.appendChild(el('span', 'pill', T.usedBy(whoName(c.who)))); b.appendChild(el('p', null, T.doneAt(fmt(c.end))));
    sh.appendChild(b); sh.appendChild(waitlist(m));
    links.push([T.changeTime, () => setMode('edit')], [T.endEarly, async () => { if (await ask(T.askEnd(mname(m)))) act('freeMachine', m.id, myName); }], [T.itsEmpty, () => setMode('takeover')]);
  } else if (s === 'done') {
    const b = el('div', 'box done'); b.appendChild(el('h3', null, T.cycleComplete));
    const p = el('p'); p.append(T.stillInside[0]); p.appendChild(el('b', null, c.who && c.who !== 'Unknown' && c.who !== 'Not logged' ? c.who : T.someone)); p.append(T.stillInside[1]); b.appendChild(p);
    sh.appendChild(b);
    sh.appendChild(btn(T.clothesOut, 'primary', () => act('freeMachine', m.id, myName)));
    const gap = el('div'); gap.style.height = '16px'; sh.appendChild(gap);
    sh.appendChild(waitlist(m));
    links.push([T.notDone, () => setMode('edit')]);
  } else if (s === 'bad') {
    const b = el('div', 'box bad'); b.appendChild(el('h3', null, T.broken)); if (c.note) b.appendChild(el('p', null, c.note)); sh.appendChild(b);
    sh.appendChild(btn(T.fixed, 'primary', () => act('freeMachine', m.id, myName)));
    if (queue(m.id).length) { const gap = el('div'); gap.style.height = '16px'; sh.appendChild(gap); sh.appendChild(waitlist(m)); }
  }
  links.push([showHist ? T.hideHistory : T.history, () => { showHist = !showHist; renderSheet(); }]);
  const lw = el('div', 'links'); links.forEach(([txt, f]) => lw.appendChild(btn(txt, 'link', f))); sh.appendChild(lw);
  if (showHist) {
    const ul = el('ul', 'hist'); const logs = (data.log && data.log[m.id]) || [];
    if (!logs.length) ul.appendChild(el('li', null, T.noHistory));
    logs.forEach(x => ul.appendChild(el('li', null, logLine(x)))); sh.appendChild(ul);
  }
  sh.scrollTop = keepScroll;
}

let modeState = null;
function setMode(m) { mode = m; modeState = state(sheetId); draft.minutes = ''; renderSheet(); }

function modeForm(m, c) {
  const w = el('div'); const back = () => { mode = null; renderSheet(); };
  if (mode === 'broken') {
    const f = el('div', 'field'); const l = el('label', null, T.whatsWrong); const i = el('input'); i.id = 'noteIn'; i.maxLength = 40; i.value = draft.note;
    i.addEventListener('input', () => { draft.note = i.value; }); l.htmlFor = 'noteIn'; f.appendChild(l); f.appendChild(i); w.appendChild(f);
    w.appendChild(btn(T.markBroken, 'primary', () => act('setBroken', m.id, draft.note, myName)));
  } else if (mode === 'edit') {
    w.appendChild(minutesField(true));
    w.appendChild(btn(T.save, 'primary', () => { const n = minutesValue(0); if (n !== null) act('editTime', m.id, n, myName); }));
  } else if (mode === 'proxy') {
    w.appendChild(minutesField(false));
    w.appendChild(el('p', 'hint', T.proxyNote));
    const gap = el('div'); gap.style.height = '12px'; w.appendChild(gap);
    w.appendChild(btn(T.markInUse, 'primary', () => { const n = minutesValue(1); if (n !== null) act('start', m.id, n, myName, 'proxy'); }));
  } else if (mode === 'takeover') {
    w.appendChild(nameField()); w.appendChild(minutesField(false));
    w.appendChild(btn(T.takeOver, 'primary', async () => {
      const n = minutesValue(1); if (n === null) return;
      if (await ask(T.askEmpty(mname(m)))) act('start', m.id, n, myName, 'takeover');
    }));
  }
  w.appendChild(btn(T.cancel, 'secondary', back));
  return w;
}

function waitlist(m) {
  const q = queue(m.id), box = el('div', 'wl');
  const head = el('div', 'wlhead'); head.appendChild(el('b', null, T.waitlist)); head.appendChild(el('span', 'badge', T.waitingN(q.length))); box.appendChild(head);
  if (!q.some(mineEntry)) {
    const row = el('div', 'join'); const i = el('input'); i.value = myName; i.placeholder = T.yourName; i.maxLength = 20; i.setAttribute('aria-label', T.yourName);
    i.addEventListener('input', () => setName(i.value));
    row.appendChild(i);
    row.appendChild(btn(T.join, '', () => {
      if (!myName) return toast(T.err.name);
      if (q.some(e => same(e.name, myName))) return toast(T.err.dup(myName));
      run('joinQueue', [m.id, myName], d => { if (d.joined) { myQueue.push({ id: d.joined, key: d.key }); store.set('myQueue2', myQueue); } });
    }));
    box.appendChild(row);
  }
  if (!storageOk) { const w = el('p', 'hint', T.noStorage); w.style.margin = '10px 2px 0'; box.appendChild(w); }
  if (q.length) {
    const ol = el('ol');
    q.forEach((e, i) => {
      const li = el('li'); li.appendChild(el('span', 'n', '#' + (i + 1))); li.appendChild(el('span', 'who', e.name));
      if (mineEntry(e)) { li.appendChild(el('span', 'me', T.you)); li.appendChild(btn(T.leave, 'x', () => run('leaveQueue', [m.id, e.id, myKey(e.id)]))); }
      else if (e.old) li.appendChild(btn(T.leave, 'x', () => run('leaveQueue', [m.id, e.id, ''])));   // added before this version
      ol.appendChild(li);
    });
    box.appendChild(ol);
  }
  return box;
}

// ---------- actions ----------
function run(fn, args, after) {
  if (working) return;
  working = true;
  document.querySelectorAll('#grid button, #sheet button').forEach(b => b.disabled = true);   // these are rebuilt after the call
  call(fn, ...args)
    .then(d => { if (after) after(d); toast(''); working = false; apply(d, true); })
    .catch(e => { working = false; toast(errText(e)); render(); load(); });
}
function act(fn, ...args) { run(fn, args, () => { mode = null; draft.minutes = ''; draft.note = ''; }); }

// ---------- timers ----------
function tickClock() { const d = new Date(now()); $('date').textContent = dateStr(d); $('time').textContent = timeStr(d, true); }
setInterval(() => {
  tickClock();
  if (!data || document.hidden) return;
  const changed = [...document.querySelectorAll('.tile')].some(t => t.dataset.s !== state(t.dataset.id));
  if ((changed || pending) && !uiBusy()) { render(); return; }
  if (changed) pending = true;
  document.querySelectorAll('.tbig[data-end]').forEach(b => { b.textContent = T.minShort(mins(Number(b.dataset.end))); });
  document.querySelectorAll('[data-mmss]').forEach(b => { b.textContent = mmss(Number(b.dataset.mmss)); });
}, 1000);
setInterval(() => {
  if (document.hidden || working) return;
  if (Date.now() - lastActive > IDLE_MS) { paused = true; return; }
  load();
}, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { wake(); load(); } });
$('lang-en').onclick = () => setLang('en');
$('lang-fr').onclick = () => setLang('fr');
setLang(lang);
load();
</script>
</body>
</html>
